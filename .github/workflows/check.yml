name: Devonshire lunch watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to check (YYYY-MM-DD)"
        default: "2026-10-26"

permissions:
  contents: write

concurrency: watch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check availability
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DATE: ${{ inputs.date || '2026-10-26' }}
        run: python check.py
      - name: Save state
        if: ${{ !inputs.date || inputs.date == '2026-10-26' }}
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add last_seen.txt
          git diff --cached --quiet || (git commit -m "Update last seen slots" && git push)
